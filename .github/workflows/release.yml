name: Release

# Publishes a GitHub Release with the board-app artifacts whenever a version
# tag (v0.1.0) is pushed. Use ./release.sh to commit + tag in one step.
#
# The PCF controls solution is no longer built or shipped
# (docs/leanboard-pcf-retirement-plan.md); the last importable
# LeanToolKit_*.zip pair is attached to the v0.12.0 release, which is the
# permanent archive.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release

jobs:
  # Board-app artifacts: the installable code-app package always; the
  # managed LeanToolKitData tables zip when the service-principal secrets
  # exist (docs/deploy-to-new-org.md is the receiving org's runbook).
  board-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # no root install needed: the repo tsconfig became standalone when the
      # PCF target retired, so vite resolves the shared/ + controls/ editor
      # sources from app/ alone (verified 2026-07-25)
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      # the second code app (LeanBoard Utilities, utility/) — it rides in the
      # managed solution like LeanBoard; this package is its pac fallback
      - name: Build utility app
        working-directory: utility
        run: |
          npm ci
          npm run build

      - name: Stage app package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p ship/app dist
          cp -r app/dist ship/app/dist
          # template the config: target org sets environmentId + connection,
          # and the first push mints the appId
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app/power.config.json", "utf8"));
            delete cfg.appId;
            cfg.environmentId = "";
            fs.writeFileSync("ship/app/power.config.json", JSON.stringify(cfg, null, 2));
          '
          cp docs/deploy-to-new-org.md ship/app/INSTALL.md
          (cd ship/app && zip -rq "../../dist/LeanBoardApp_${TAG}.zip" .)
          mkdir -p ship/utility
          cp -r utility/dist ship/utility/dist
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("utility/power.config.json", "utf8"));
            delete cfg.appId;
            cfg.environmentId = "";
            fs.writeFileSync("ship/utility/power.config.json", JSON.stringify(cfg, null, 2));
          '
          cp docs/deploy-to-new-org.md ship/utility/INSTALL.md
          (cd ship/utility && zip -rq "../../dist/LeanBoardUtilitiesApp_${TAG}.zip" .)

      - name: Check pipeline secrets
        id: secrets
        env:
          PP_APP_ID: ${{ secrets.PP_APP_ID }}
        run: echo "present=$([ -n "$PP_APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install pac
        if: steps.secrets.outputs.present == 'true'
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Export managed data solution from Dev
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          pac auth create --applicationId "${{ secrets.PP_APP_ID }}" \
            --clientSecret "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --environment "${{ vars.PP_DEV_URL }}"
          pac solution online-version --solution-name LeanToolKitData \
            --solution-version "${TAG#v}"
          pac solution export --name LeanToolKitData --managed \
            --path "dist/LeanBoard_${TAG}_managed.zip"

      # The managed solution carries the code app as Dev holds it at THIS
      # moment — "every export snapshots the latest pushed bundle". If the
      # tag's own build was not pushed to Dev before the tag was pushed,
      # the solution ships the previous dev build under this version
      # (v0.98.0 shipped a bundle stamped v0.97.0-2-g9b095cf, 2026-11-22;
      # production read "v0.97.0 +2"). Refuse to publish that.
      - name: Check the managed solution carries this tag's app
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          rm -rf check && mkdir check
          unzip -q "dist/LeanBoard_${TAG}_managed.zip" -d check
          APP_DIR="$(find check/CanvasApps -maxdepth 1 -type d -name 'ben_leantoolkit_*_CodeAppPackages' | head -n 1)"
          if [ -z "$APP_DIR" ]; then
            echo "::error::The managed solution holds no LeanBoard code app."
            exit 1
          fi
          # a build past an older tag is stamped vX.Y.Z-N-gSHA; a build
          # of an edited tree ends -dirty and never records itself current
          STALE="$(grep -rhoaE 'v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+(-dirty)?' "$APP_DIR" | sort -u | head -n 3 || true)"
          if [ -n "$STALE" ]; then
            echo "::error::The managed solution carries the app build ${STALE}, not ${TAG}. Push the tag's build to Dev (cd app && npm run build && npm run push) BEFORE pushing the tag, then re-run this workflow."
            exit 1
          fi
          if grep -rqaF "${TAG}-dirty" "$APP_DIR"; then
            echo "::error::The managed solution's app is stamped ${TAG}-dirty: Dev was pushed from an edited tree."
            exit 1
          fi
          if ! grep -rqaF "${TAG}" "$APP_DIR"; then
            echo "::error::The managed solution's app carries no ${TAG} stamp."
            exit 1
          fi
          echo "The managed solution carries the ${TAG} app."

      - name: Create the GitHub Release with the board-app artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
